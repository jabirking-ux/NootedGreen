
name: Build NootedGreen

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up diagnostics
        shell: bash
        run: |
          mkdir -p artifacts
          echo "GitHub Actions runner initialized." \
            > artifacts/upload-test.txt

      - name: Inspect Xcode project
        shell: bash
        run: |
          {
            echo "=== Xcode version ==="
            xcodebuild -version

            echo "=== Available schemes ==="
            xcodebuild -list \
              -project NootedGreen.xcodeproj

            echo "=== Project files ==="
            find . -maxdepth 4 \
              \( -name '*.xcscheme' \
                 -o -name 'Package.swift' \
                 -o -name '*.xcodeproj' \) \
              -print
          } > artifacts/project-info.txt 2>&1

          cat artifacts/project-info.txt

      - name: Build NootedGreen
        shell: bash
        run: |
          set +e

          xcodebuild \
            -project NootedGreen.xcodeproj \
            -scheme NootedGreen \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build > artifacts/build.log 2>&1

          RESULT=$?
          echo "$RESULT" > artifacts/build-exit-code.txt

          echo "xcodebuild exit code: $RESULT"
          tail -n 100 artifacts/build.log

      - name: Collect build products
        if: always()
        shell: bash
        run: |
          {
            echo "=== .kext directories ==="
            find "$GITHUB_WORKSPACE" "$RUNNER_TEMP" \
              -type d -name '*.kext' -print 2>/dev/null

            echo "=== Executables and products ==="
            find "$RUNNER_TEMP/DerivedData" \
              -maxdepth 8 \
              \( -name 'NootedGreen' \
                 -o -name '*.framework' \
                 -o -name '*.dylib' \
                 -o -name '*.a' \
                 -o -name '*.kext' \) \
              -print 2>/dev/null

            echo "=== Build settings ==="
            xcodebuild \
              -project NootedGreen.xcodeproj \
              -scheme NootedGreen \
              -configuration Release \
              -showBuildSettings 2>&1 |
              grep -E \
                ' (TARGET_NAME|PRODUCT_NAME|FULL_PRODUCT_NAME|PRODUCT_TYPE|BUILT_PRODUCTS_DIR|TARGET_BUILD_DIR|MACH_O_TYPE) =' \
              || true
          } > artifacts/diagnostics.txt

          cat artifacts/diagnostics.txt

          KEXT_PATH=$(find "$GITHUB_WORKSPACE" "$RUNNER_TEMP" \
            -type d -name 'NootedGreen.kext' \
            -print -quit 2>/dev/null)

          if [ -n "$KEXT_PATH" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "$KEXT_PATH" artifacts/NootedGreen.kext.zip
            echo "Kext archived: $KEXT_PATH"
          else
            echo "No NootedGreen.kext found."
          fi

      - name: Upload logs and products
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: NootedGreen-build-results
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Report result
        if: always()
        shell: bash
        run: |
          if [ ! -f artifacts/build-exit-code.txt ]; then
            echo "Build step did not record an exit code."
            exit 1
          fi

          RESULT=$(cat artifacts/build-exit-code.txt)

          if [ "$RESULT" != "0" ]; then
            echo "Xcode build failed. Download build.log."
            exit 1
          fi

          if [ ! -f artifacts/NootedGreen.kext.zip ]; then
            echo "Build succeeded, but the expected kext was not found."
            echo "Check diagnostics.txt and project-info.txt."
            exit 1
          fi

          echo "NootedGreen.kext.zip was created."
