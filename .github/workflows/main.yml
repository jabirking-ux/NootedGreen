
name: Build NootedGreen

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Prepare output folder
        shell: bash
        run: mkdir -p artifacts

      - name: Build NootedGreen
        shell: bash
        run: |
          set +e

          xcodebuild \
            -project NootedGreen.xcodeproj \
            -scheme NootedGreen \
            -configuration Release \
            -sdk macosx \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1

          RESULT=$?
          echo "$RESULT" > artifacts/build-exit-code.txt
          cp build.log artifacts/build.log

          echo "Xcode exit code: $RESULT"

          if [ "$RESULT" -ne 0 ]; then
            echo "Build failed. See build.log in the artifact."
          fi

      - name: Collect compiled products
        if: always()
        shell: bash
        run: |
          {
            echo "=== Repository and runner build products ==="

            find "$GITHUB_WORKSPACE" "$RUNNER_TEMP" \
              -name 'NootedGreen.kext' -type d \
              -print 2>/dev/null

            echo "=== Xcode build settings ==="

            xcodebuild \
              -project NootedGreen.xcodeproj \
              -scheme NootedGreen \
              -showBuildSettings 2>&1 |
              grep -E \
                ' (TARGET_BUILD_DIR|BUILT_PRODUCTS_DIR|FULL_PRODUCT_NAME) =' \
              || true
          } > artifacts/diagnostics.txt

          echo "GitHub Actions artifact upload test" \
            > artifacts/upload-test.txt

          KEXT_PATH=$(find "$GITHUB_WORKSPACE" "$RUNNER_TEMP" \
            -name 'NootedGreen.kext' -type d \
            -print -quit 2>/dev/null)

          if [ -n "$KEXT_PATH" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "$KEXT_PATH" artifacts/NootedGreen.kext.zip
            echo "Packaged: $KEXT_PATH"
          else
            echo "No compiled NootedGreen.kext found."
          fi

      - name: Upload build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: NootedGreen-build-results
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Set final build status
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/build-exit-code.txt ]; then
            RESULT=$(cat artifacts/build-exit-code.txt)
            if [ "$RESULT" != "0" ]; then
              echo "Xcode build failed. Download the logs."
              exit 1
            fi
          else
            echo "Xcode build did not produce an exit code."
            exit 1
          fi
